[pytest]
testpaths = backend/tests
addopts = --strict-markers
markers =
    unit: isolated tests using in-memory collaborators or test doubles
    integration: API, repository, service, and workflow integration tests
    migration: database migration and backward-compatibility tests
    e2e: full lifecycle, restart, replay, and recovery tests
    live_llm: opt-in smoke test that contacts the configured LLM provider

