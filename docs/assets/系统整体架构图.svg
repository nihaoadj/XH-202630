<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1195" viewBox="0 0 1360 1195" role="img" aria-labelledby="title desc">
  <title id="title">领域知识个性化生成与多智能体协同决策系统整体架构</title>
  <desc id="desc">五层展示前端与 API、领域服务、两类资源工作流、平台能力以及数据和模型依赖。SQLite 文本 Worker 与互动课件 Worker 独立执行任务。</desc>
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#edf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#496b8a"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b42}
      .title{font-size:30px;font-weight:700;letter-spacing:.5px}.layer-title{font-size:22px;font-weight:700}
      .h{font-size:21px;font-weight:700}.p{font-size:17px;fill:#425d75}.small{font-size:16px;fill:#425d75}
      .card{fill:#fff;stroke-width:2}.flow{fill:none;stroke:#496b8a;stroke-width:1.8;marker-end:url(#arrow)}.bus{fill:none;stroke:#9eb3c6;stroke-width:2}
      .blue{fill:#f8fbff;stroke:#69a9e8}.slate{fill:#f8fafc;stroke:#9eb6ca}.purple{fill:#fbf9ff;stroke:#a991e3}.cyan{fill:#f4fbfd;stroke:#79bfd2}.green{fill:#f7fcf8;stroke:#79be8c}
    </style>
  </defs>

  <rect width="1360" height="1195" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="20" y="20" width="1320" height="80" rx="18" fill="url(#headerBg)" stroke="#cfe0f5" filter="url(#shadow)"/>
  <text x="680" y="62" text-anchor="middle" class="title"><tspan fill="#13233a">领域知识个性化生成与多智能体协同决策系统</tspan><tspan fill="#2563eb">整体架构</tspan></text>
  <path d="M590 81H770" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/><circle cx="680" cy="81" r="4.5" fill="#2563eb"/>

  <!-- 1. Interaction and API -->
  <rect x="20" y="120" width="1320" height="148" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="44" y="153" class="layer-title" fill="#1d4ed8">1. 交互与接口层</text>

  <g transform="translate(44,173)"><rect class="card blue" width="350" height="76" rx="14"/>
    <text x="175" y="31" text-anchor="middle" class="h">学习者</text>
    <text x="175" y="61" text-anchor="middle" class="p">阅读 · 练习 · 测评</text>
  </g>
  <path class="flow" d="M400 211H428"/>
  <g transform="translate(434,173)"><rect class="card blue" width="406" height="76" rx="14"/>
    <text x="203" y="31" text-anchor="middle" class="h">Vue 3 学习工作台</text>
    <text x="203" y="61" text-anchor="middle" class="p">资源学习与反馈</text>
  </g>
  <path class="flow" d="M846 211H874"/>
  <g transform="translate(880,173)"><rect class="card blue" width="436" height="76" rx="14"/>
    <text x="218" y="31" text-anchor="middle" class="h">FastAPI 领域 API</text>
    <text x="218" y="61" text-anchor="middle" class="p">认证 · 接口 · SSE</text>
  </g>

  <!-- 2. Application services -->
  <rect x="20" y="290" width="1320" height="205" rx="20" fill="#f4f8fb" stroke="#cbd8e3" stroke-width="2"/>
  <text x="44" y="322" class="layer-title" fill="#365f7d">2. 应用服务层</text>

  <g transform="translate(44,375)"><rect class="card slate" width="303" height="100" rx="14"/>
    <text x="151.5" y="43" text-anchor="middle" class="h">学习者与知识服务</text>
    <text x="151.5" y="73" text-anchor="middle" class="p">画像、诊断与知识目录</text>
  </g>
  <g transform="translate(367,375)"><rect class="card slate" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">文本资源服务</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">任务提交与恢复</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">发布资源与审核查询</text>
  </g>
  <g transform="translate(690,375)"><rect class="card slate" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">互动课件服务</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">任务提交与恢复</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">成品与学习进度查询</text>
  </g>
  <g transform="translate(1013,375)"><rect class="card slate" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">学习反馈与查询</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">轮次测评 · Tutor</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">资源聚合 · 学情报告</text>
  </g>

  <path class="bus" d="M1098 255V343M195.5 343H1164.5"/>
  <path class="flow" d="M195.5 343V369"/>
  <path class="flow" d="M518.5 343V369"/>
  <path class="flow" d="M841.5 343V369"/>
  <path class="flow" d="M1164.5 343V369"/>

  <!-- 3. Agents and workflows -->
  <rect x="20" y="529" width="1320" height="201" rx="20" fill="#faf8ff" stroke="#d8cdf0" stroke-width="2"/>
  <text x="44" y="561" class="layer-title" fill="#6d28d9">3. Agent 与领域工作流层</text>

  <g transform="translate(44,580)"><rect class="card purple" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">诊断 Agent</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">读取画像与薄弱项</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">推荐资源难度</text>
  </g>
  <g transform="translate(367,580)"><rect class="card purple" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">文本生成 · 独立 Worker</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">证据门 → 规划 → 生成</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">审核 → 可选 Claim → 发布</text>
  </g>
  <g transform="translate(690,580)"><rect class="card purple" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">互动课件 · 独立 Worker</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">冻结来源 → 场景生成</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">自动审核 → 渲染与发布门禁</text>
  </g>
  <g transform="translate(1013,580)"><rect class="card purple" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">反馈策略与 Tutor</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">依据测评推荐下一步</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">基于证据导学</text>
  </g>

  <rect x="44" y="690" width="1272" height="28" rx="10" fill="#f1edfb" stroke="#c7b8ea"/>
  <text x="680" y="710" text-anchor="middle" class="small">共享契约与工作流工具 · models / agents/shared</text>

  <path class="flow" d="M680 501V523"/>

  <!-- 4. Deterministic platform -->
  <rect x="20" y="764" width="1320" height="164" rx="20" fill="#f3fafc" stroke="#bfdae3" stroke-width="2"/>
  <text x="44" y="796" class="layer-title" fill="#0f7185">4. 平台能力层</text>

  <g transform="translate(44,814)"><rect class="card cyan" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">证据检索</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">向量与 BM25 混合检索</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">节点优先 · 同库回退</text>
  </g>
  <g transform="translate(367,814)"><rect class="card cyan" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">LLM 网关</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">结构化输出校验</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">预算、超时与用量记录</text>
  </g>
  <g transform="translate(690,814)"><rect class="card cyan" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">课件运行时</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">注册组件 · 安全渲染</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">打包与发布校验</text>
  </g>
  <g transform="translate(1013,814)"><rect class="card cyan" width="303" height="100" rx="14"/>
    <text x="151.5" y="32" text-anchor="middle" class="h">事件与运行状态</text>
    <text x="151.5" y="62" text-anchor="middle" class="p">事件回放 · 检查点</text>
    <text x="151.5" y="90" text-anchor="middle" class="p">幂等执行 · 文件存储</text>
  </g>

  <path class="flow" d="M680 736V758"/>
  <path class="flow" d="M680 934V956"/>

  <!-- 5. Data and external dependencies -->
  <rect x="20" y="962" width="1320" height="213" rx="20" fill="#f5faf7" stroke="#c7dfcf" stroke-width="2"/>
  <text x="44" y="997" class="layer-title" fill="#287447">5. 数据与外部依赖层</text>

  <g transform="translate(44,1018)"><rect class="card green" width="238.4" height="100" rx="14"/>
    <text x="119.2" y="32" text-anchor="middle" class="h">知识源</text>
    <text x="119.2" y="62" text-anchor="middle" class="p">领域文档与题库</text>
    <text x="119.2" y="90" text-anchor="middle" class="p">分块与节点映射</text>
  </g>
  <g transform="translate(302.4,1018)"><rect class="card green" width="238.4" height="100" rx="14"/>
    <text x="119.2" y="32" text-anchor="middle" class="h">SQLite 业务库</text>
    <text x="119.2" y="62" text-anchor="middle" class="p">轮次、测评与资源版本</text>
    <text x="119.2" y="90" text-anchor="middle" class="p">任务、审核与发布记录</text>
  </g>
  <g transform="translate(560.8,1018)"><rect class="card green" width="238.4" height="100" rx="14"/>
    <text x="119.2" y="43" text-anchor="middle" class="h">Chroma 向量索引</text>
    <text x="119.2" y="73" text-anchor="middle" class="p">按知识库隔离索引</text>
  </g>
  <g transform="translate(819.2,1018)"><rect class="card green" width="238.4" height="100" rx="14"/>
    <text x="119.2" y="32" text-anchor="middle" class="h">资源与课件产物</text>
    <text x="119.2" y="62" text-anchor="middle" class="p">Markdown · HTML / ZIP</text>
    <text x="119.2" y="90" text-anchor="middle" class="p">发布清单与版本哈希</text>
  </g>
  <g transform="translate(1077.6,1018)"><rect class="card green" width="238.4" height="100" rx="14"/>
    <text x="119.2" y="32" text-anchor="middle" class="h">模型依赖</text>
    <text x="119.2" y="62" text-anchor="middle" class="p">LLM 服务</text>
    <text x="119.2" y="90" text-anchor="middle" class="p">向量与精排模型</text>
  </g>

  <rect x="44" y="1128" width="1272" height="28" rx="11" fill="#fff8e8" stroke="#e5b65f"/>
  <text x="680" y="1147" text-anchor="middle" class="p" font-weight="700">学习闭环 · 学习资源 → 阶段测评 → 反馈 → 确认下一轮</text>
</svg>
