<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-labelledby="title desc">
  <title id="title">领域知识个性化生成与多智能体协同决策系统整体架构</title>
  <desc id="desc">按交互接口、应用服务、Agent 与领域工作流、确定性平台能力、数据与外部依赖五层展示当前系统职责和单向依赖关系。</desc>
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#edf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#496b8a"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b42}
      .title{font-size:34px;font-weight:700;letter-spacing:.5px}.layer-title{font-size:21px;font-weight:700}.layer-note{font-size:13.5px;fill:#657b90}
      .h{font-size:18px;font-weight:700}.p{font-size:14px;fill:#425d75}.small{font-size:12.5px;fill:#60788f}.code{font-size:13px;fill:#536d85}
      .card{fill:#fff;stroke-width:2}.flow{fill:none;stroke:#496b8a;stroke-width:2.6;marker-end:url(#arrow)}.bus{fill:none;stroke:#9eb3c6;stroke-width:2}
      .blue{fill:#f8fbff;stroke:#69a9e8}.slate{fill:#f8fafc;stroke:#9eb6ca}.purple{fill:#fbf9ff;stroke:#a991e3}.cyan{fill:#f4fbfd;stroke:#79bfd2}.green{fill:#f7fcf8;stroke:#79be8c}
    </style>
  </defs>

  <rect width="1800" height="1510" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="32" y="24" width="1736" height="96" rx="18" fill="url(#headerBg)" stroke="#cfe0f5" filter="url(#shadow)"/>
  <text x="900" y="76" text-anchor="middle" class="title"><tspan fill="#13233a">领域知识个性化生成与多智能体协同决策系统</tspan><tspan fill="#2563eb">整体架构</tspan></text>
  <path d="M810 98H990" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/><circle cx="900" cy="98" r="4.5" fill="#2563eb"/>

  <!-- 1. Interaction and API -->
  <rect x="32" y="145" width="1736" height="160" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="64" y="179" class="layer-title" fill="#1d4ed8">1. 交互与接口层</text>
  <text x="278" y="179" class="layer-note">负责界面交互、鉴权、请求响应与 SSE；不直接访问模型或数据库</text>

  <g transform="translate(70,205)"><rect class="card blue" width="280" height="72" rx="14"/>
    <text x="140" y="29" text-anchor="middle" class="h">学习者</text><text x="140" y="53" text-anchor="middle" class="p">学习 · 测评 · 反馈 · 导学</text>
  </g>
  <path class="flow" d="M350 241H410"/>
  <g transform="translate(410,205)"><rect class="card blue" width="540" height="72" rx="14"/>
    <text x="270" y="29" text-anchor="middle" class="h">Vue 3 前端</text><text x="270" y="53" text-anchor="middle" class="p">画像 · 诊断 · 生成 · 资源库 · 互动课件 · Tutor · 报告</text>
  </g>
  <path class="flow" d="M950 241H1020"/>
  <g transform="translate(1020,205)"><rect class="card blue" width="710" height="72" rx="14"/>
    <text x="355" y="29" text-anchor="middle" class="h">FastAPI 领域 API</text><text x="355" y="53" text-anchor="middle" class="p">认证与访问控制 · 参数/DTO 校验 · 错误映射 · HTTP / JSON / SSE</text>
  </g>

  <!-- 2. Application services -->
  <rect x="32" y="330" width="1736" height="270" rx="20" fill="#f4f8fb" stroke="#cbd8e3" stroke-width="2"/>
  <text x="64" y="365" class="layer-title" fill="#365f7d">2. 应用服务层</text>
  <text x="236" y="365" class="layer-note">负责用例编排、事务边界、状态校验与依赖注入；不拥有 Prompt、SQL 或渲染逻辑</text>

  <g transform="translate(70,400)"><rect class="card slate" width="380" height="120" rx="14"/>
    <text x="190" y="31" text-anchor="middle" class="h">学习者与知识服务</text>
    <text x="190" y="58" text-anchor="middle" class="code">users · onboarding · learners · knowledge</text>
    <text x="190" y="84" text-anchor="middle" class="p">用户资料、画像、诊断与知识目录用例</text>
    <text x="190" y="106" text-anchor="middle" class="small">稳定学习事实通过仓储提交</text>
  </g>
  <g transform="translate(470,400)"><rect class="card slate" width="380" height="120" rx="14"/>
    <text x="190" y="31" text-anchor="middle" class="h">文本资源服务</text>
    <text x="190" y="58" text-anchor="middle" class="code">generation · learning_documents · reviews</text>
    <text x="190" y="84" text-anchor="middle" class="p">创建任务、执行工作流、资源发布与审核查询</text>
    <text x="190" y="106" text-anchor="middle" class="small">五类文本资源共享统一发布边界</text>
  </g>
  <g transform="translate(870,400)"><rect class="card slate" width="380" height="120" rx="14"/>
    <text x="190" y="31" text-anchor="middle" class="h">互动课件服务</text>
    <text x="190" y="58" text-anchor="middle" class="code">courseware</text>
    <text x="190" y="84" text-anchor="middle" class="p">任务创建/恢复、Worker 调度与发布门面</text>
    <text x="190" y="106" text-anchor="middle" class="small">不持有 Prompt、审核节点或 renderer</text>
  </g>
  <g transform="translate(1270,400)"><rect class="card slate" width="460" height="120" rx="14"/>
    <text x="230" y="31" text-anchor="middle" class="h">学习闭环与查询服务</text>
    <text x="230" y="58" text-anchor="middle" class="code">feedback · tutor · reports · resource_library · runs</text>
    <text x="230" y="84" text-anchor="middle" class="p">反馈事务、Tutor 门面、报告与跨资源只读聚合</text>
    <text x="230" y="106" text-anchor="middle" class="small">查询投影不拥有资源生成逻辑</text>
  </g>

  <rect x="70" y="544" width="1660" height="34" rx="10" fill="#eaf1f6" stroke="#b8c9d7"/>
  <text x="900" y="566" text-anchor="middle" class="small">组合根与执行适配：config.py / containers.py 注入依赖 · 文本任务使用 BackgroundTasks · 课件任务由 SQLite 单 Durable Worker 执行</text>

  <path class="bus" d="M1375 277V382M260 382H1500"/>
  <path class="flow" d="M260 382V400"/>
  <path class="flow" d="M660 382V400"/>
  <path class="flow" d="M1060 382V400"/>
  <path class="flow" d="M1500 382V400"/>

  <!-- 3. Agents and workflows -->
  <rect x="32" y="625" width="1736" height="330" rx="20" fill="#faf8ff" stroke="#d8cdf0" stroke-width="2"/>
  <text x="64" y="659" class="layer-title" fill="#6d28d9">3. Agent 与领域工作流层</text>
  <text x="346" y="659" class="layer-note">负责领域推理、版本化状态机与定向返工；通过注入的仓储/平台能力执行，不处理 HTTP 或编写 SQL</text>

  <g transform="translate(70,700)"><rect class="card purple" width="360" height="170" rx="14"/>
    <text x="180" y="31" text-anchor="middle" class="h">诊断 Agent</text>
    <text x="180" y="60" text-anchor="middle" class="code">learning_agents/diagnosis_agent</text>
    <text x="180" y="88" text-anchor="middle" class="p">识别盲点、能力标签与推荐难度</text>
    <text x="180" y="115" text-anchor="middle" class="p">为检索与学习规划提供目标节点</text>
    <text x="180" y="143" text-anchor="middle" class="small">模型异常按显式策略降级</text>
  </g>
  <g transform="translate(470,700)"><rect class="card purple" width="440" height="170" rx="14"/>
    <text x="220" y="31" text-anchor="middle" class="h">文本学习文档域</text>
    <text x="220" y="58" text-anchor="middle" class="p">工作流：检索 → Planner / Spec → 并发生成</text>
    <text x="220" y="85" text-anchor="middle" class="p">普通审核 → 可选 Claim 审核 → 发布决策</text>
    <text x="220" y="112" text-anchor="middle" class="p">专用 Agent：text / practice / assessment</text>
    <text x="220" y="135" text-anchor="middle" class="p">case_study / checklist；correction_package 仅反馈触发</text>
    <text x="220" y="157" text-anchor="middle" class="small">正文 Prompt 归专用 Agent；工作流只负责编排</text>
  </g>
  <g transform="translate(950,700)"><rect class="card purple" width="440" height="170" rx="14"/>
    <text x="220" y="31" text-anchor="middle" class="h">互动课件域</text>
    <text x="220" y="58" text-anchor="middle" class="p">冻结来源 → 学习设计 → 场景结构化生成</text>
    <text x="220" y="85" text-anchor="middle" class="p">规则硬门 → 教学质量审核 → 定向修订</text>
    <text x="220" y="112" text-anchor="middle" class="p">输出版本化结构契约与候选发布状态</text>
    <text x="220" y="139" text-anchor="middle" class="small">模型不得直接输出或控制 HTML / CSS / JavaScript</text>
  </g>
  <g transform="translate(1430,700)"><rect class="card purple" width="300" height="170" rx="14"/>
    <text x="150" y="31" text-anchor="middle" class="h">反馈策略与 Tutor</text>
    <text x="150" y="60" text-anchor="middle" class="code">deterministic policy · Tutor Agent</text>
    <text x="150" y="88" text-anchor="middle" class="p">选择补救、练习或进阶目标</text>
    <text x="150" y="115" text-anchor="middle" class="p">基于受控 Evidence 提供导学</text>
    <text x="150" y="143" text-anchor="middle" class="small">状态写入仍由服务层负责</text>
  </g>

  <rect x="70" y="890" width="1660" height="40" rx="10" fill="#f1edfb" stroke="#c7b8ea"/>
  <text x="900" y="915" text-anchor="middle" class="small">共享契约与能力：models 提供 DTO / 状态 / 枚举；agents/shared 提供检索适配、策略与校验；领域之间不共享可变工作流状态</text>

  <path class="flow" d="M900 578V615"/>

  <!-- 4. Deterministic platform -->
  <rect x="32" y="975" width="1736" height="220" rx="20" fill="#f3fafc" stroke="#bfdae3" stroke-width="2"/>
  <text x="64" y="1009" class="layer-title" fill="#0f7185">4. 确定性平台能力层</text>
  <text x="297" y="1009" class="layer-note">提供检索、模型、确定性课件运行时与事件/存储适配，由服务或工作流注入使用</text>

  <g transform="translate(70,1045)"><rect class="card cyan" width="400" height="115" rx="14"/>
    <text x="200" y="31" text-anchor="middle" class="h">可信检索与 Evidence</text>
    <text x="200" y="58" text-anchor="middle" class="p">节点范围 → 向量 + BM25 + 精排</text>
    <text x="200" y="83" text-anchor="middle" class="p">不足时全库兜底一次 → 冻结证据快照</text>
    <text x="200" y="104" text-anchor="middle" class="small">校验 KB、Chunk、版本、Hash 与数量门槛</text>
  </g>
  <g transform="translate(500,1045)"><rect class="card cyan" width="370" height="115" rx="14"/>
    <text x="185" y="31" text-anchor="middle" class="h">模型与结构化契约</text>
    <text x="185" y="58" text-anchor="middle" class="p">LLM Gateway · structured output</text>
    <text x="185" y="83" text-anchor="middle" class="p">输出 Schema / DTO 校验 · 超时 · 预算 · 失败策略</text>
    <text x="185" y="104" text-anchor="middle" class="small">Provider 只能通过统一 Gateway 调用</text>
  </g>
  <g transform="translate(900,1045)"><rect class="card cyan" width="390" height="115" rx="14"/>
    <text x="195" y="31" text-anchor="middle" class="h">课件确定性运行时</text>
    <text x="195" y="58" text-anchor="middle" class="p">组件注册表 · renderer · security</text>
    <text x="195" y="83" text-anchor="middle" class="p">packaging · provenance · release candidate</text>
    <text x="195" y="104" text-anchor="middle" class="small">结构契约不能绕过硬门直接发布</text>
  </g>
  <g transform="translate(1320,1045)"><rect class="card cyan" width="410" height="115" rx="14"/>
    <text x="205" y="31" text-anchor="middle" class="h">事件、幂等与文件能力</text>
    <text x="205" y="58" text-anchor="middle" class="p">WorkflowEvent · checkpoint · idempotency</text>
    <text x="205" y="83" text-anchor="middle" class="p">文件存储 · artifact hash · 发布清单</text>
    <text x="205" y="104" text-anchor="middle" class="small">为 SSE、回放、重试与审计提供基础</text>
  </g>

  <path class="flow" d="M900 930V965"/>
  <path class="flow" d="M900 1160V1210"/>

  <!-- 5. Data and external dependencies -->
  <rect x="32" y="1220" width="1736" height="260" rx="20" fill="#f5faf7" stroke="#c7dfcf" stroke-width="2"/>
  <text x="64" y="1254" class="layer-title" fill="#287447">5. 数据与外部依赖层</text>
  <text x="289" y="1254" class="layer-note">当前部署以 SQLite 为业务事实与审计源；Chroma 仅保存向量索引</text>

  <g transform="translate(70,1275)"><rect class="card green" width="280" height="120" rx="14"/>
    <text x="140" y="30" text-anchor="middle" class="h">知识源与入库资料</text>
    <text x="140" y="58" text-anchor="middle" class="p">领域文档 · 元数据 · 题库</text>
    <text x="140" y="83" text-anchor="middle" class="p">Chunk 切分 · 节点映射 · 版本</text>
    <text x="140" y="105" text-anchor="middle" class="small">通过受控入库脚本进入系统</text>
  </g>
  <g transform="translate(380,1275)"><rect class="card green" width="430" height="120" rx="14"/>
    <text x="215" y="30" text-anchor="middle" class="h">SQLite：业务事实与审计源</text>
    <text x="215" y="57" text-anchor="middle" class="p">用户 / 画像 / 诊断 / Attempt / 学习路径</text>
    <text x="215" y="82" text-anchor="middle" class="p">Job / Run / Event / Resource / Review / Claim / Courseware</text>
    <text x="215" y="105" text-anchor="middle" class="small">事务、唯一约束、活动版本与可回放状态</text>
  </g>
  <g transform="translate(840,1275)"><rect class="card green" width="270" height="120" rx="14"/>
    <text x="135" y="30" text-anchor="middle" class="h">Chroma：向量索引</text>
    <text x="135" y="58" text-anchor="middle" class="p">按知识库隔离 collection</text>
    <text x="135" y="83" text-anchor="middle" class="p">只提供语义候选</text>
    <text x="135" y="105" text-anchor="middle" class="small">不保存业务真相</text>
  </g>
  <g transform="translate(1140,1275)"><rect class="card green" width="310" height="120" rx="14"/>
    <text x="155" y="30" text-anchor="middle" class="h">资源与课件产物</text>
    <text x="155" y="58" text-anchor="middle" class="p">Markdown · HTML / ZIP · snapshot</text>
    <text x="155" y="83" text-anchor="middle" class="p">artifact hash · release manifest</text>
    <text x="155" y="105" text-anchor="middle" class="small">版本化产物不原地覆盖</text>
  </g>
  <g transform="translate(1480,1275)"><rect class="card green" width="250" height="120" rx="14"/>
    <text x="125" y="30" text-anchor="middle" class="h">模型运行依赖</text>
    <text x="125" y="58" text-anchor="middle" class="p">LLM Provider</text>
    <text x="125" y="83" text-anchor="middle" class="p">本地 Embedding 模型</text>
    <text x="125" y="105" text-anchor="middle" class="small">由平台适配层访问</text>
  </g>

  <rect x="70" y="1415" width="1660" height="42" rx="11" fill="#fff8e8" stroke="#e5b65f"/>
  <text x="900" y="1442" text-anchor="middle" class="p" font-weight="700">学习闭环：发布资源 / 课件 → 阅读、测评与 Tutor → Attempt / 反馈事务 → 掌握度与学习路径 → 按决策可创建后续生成任务</text>
</svg>
