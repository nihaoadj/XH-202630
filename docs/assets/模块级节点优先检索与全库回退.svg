<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">节点优先混合检索与全库回退</title>
  <desc id="desc">按任务输入、证据检索器、工作流证据门禁和工作流去向四个模块展示检索逻辑：优先在目标节点对应的内容分块中检索；无目标节点、映射缺失或证据不足时仅执行一次全库检索；检索异常不触发全库回退；最终结果统一经过证据门禁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f3f8fc"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#294966" flood-opacity=".10"/></filter>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#244f70}.title{font-size:36px;font-weight:700}.sub{font-size:18px}.module{font-size:21px;font-weight:700}.h{font-size:19px;font-weight:700}.p{font-size:15.5px}.small{font-size:13.5px}.tag{font-size:13px;font-weight:700}.box{stroke-width:2}.blue{fill:#eaf5ff;stroke:#90c7e9}.green{fill:#edf8f0;stroke:#8fd1a2}.orange{fill:#fff6e5;stroke:#ecc16f}.purple{fill:#f3efff;stroke:#b8a5e7}.red{fill:#fff0ee;stroke:#e6a09a}.line,.fallback,.fallbackJoin,.branchStem,.error{stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#4f91bf;marker-end:url(#a)}.fallback{stroke:#d98524;marker-end:url(#b)}.fallbackJoin{stroke:#d98524}.branchStem{stroke:#7398b3}.error{stroke:#c65f58;marker-end:url(#c)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4f91bf"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d98524"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c65f58"/></marker>
  </defs>

  <rect width="1800" height="1000" fill="url(#bg)"/>
  <text x="900" y="54" text-anchor="middle" class="title">节点优先混合检索与全库回退</text>
  <text x="900" y="86" text-anchor="middle" class="sub">先在目标节点范围内检索；无目标节点、映射缺失或证据不足时，仅回退一次全库检索</text>

  <!-- 四个职责模块 -->
  <rect x="35" y="115" width="285" height="780" rx="18" fill="#f2f8fd" stroke="#bfd9ea"/>
  <rect x="340" y="115" width="850" height="780" rx="18" fill="#fbfaff" stroke="#d6ccec"/>
  <rect x="1210" y="115" width="270" height="780" rx="18" fill="#f5fbf7" stroke="#b9dfc4"/>
  <rect x="1500" y="115" width="265" height="780" rx="18" fill="#fffaf3" stroke="#ead3ad"/>
  <path d="M35 173V133Q35 115 53 115H302Q320 115 320 133V173Z" fill="#dfeffc"/>
  <path d="M340 173V133Q340 115 358 115H1172Q1190 115 1190 133V173Z" fill="#eee9fb"/>
  <path d="M1210 173V133Q1210 115 1228 115H1462Q1480 115 1480 133V173Z" fill="#e4f4e8"/>
  <path d="M1500 173V133Q1500 115 1518 115H1747Q1765 115 1765 133V173Z" fill="#fff0d6"/>
  <text x="177" y="151" text-anchor="middle" class="module">任务输入</text>
  <text x="765" y="151" text-anchor="middle" class="module">证据检索器</text>
  <text x="1345" y="151" text-anchor="middle" class="module">工作流证据门禁</text>
  <text x="1632" y="151" text-anchor="middle" class="module">工作流去向</text>

  <!-- 任务输入 -->
  <g transform="translate(60,300)">
    <rect class="box blue" width="235" height="135" rx="16" filter="url(#shadow)"/>
    <text x="117" y="36" text-anchor="middle" class="h">冻结检索输入</text>
    <text x="117" y="66" text-anchor="middle" class="p">主题 + 知识库标识</text>
    <text x="117" y="94" text-anchor="middle" class="small">目标节点来自确认后的学习目标</text>
    <text x="117" y="117" text-anchor="middle" class="small">或诊断结果，最多取前三项并去重</text>
  </g>
  <path class="line" d="M177 435V520"/>
  <polygon points="177,520 267,600 177,680 87,600" fill="#fff" stroke="#90c7e9" stroke-width="2"/>
  <text x="177" y="579" text-anchor="middle" class="h">是否有已确认的</text>
  <text x="177" y="607" text-anchor="middle" class="h">目标节点？</text>
  <path class="branchStem" d="M267 600H315"/>

  <!-- 节点范围优先检索 -->
  <text x="380" y="230" class="tag">节点范围优先路径</text>
  <path class="line" d="M315 600Q330 600 330 585V337Q330 322 345 322H380"/>
  <text x="305" y="585" class="tag">有</text>
  <g transform="translate(380,250)">
    <rect class="box green" width="270" height="145" rx="16" filter="url(#shadow)"/>
    <text x="135" y="35" text-anchor="middle" class="h">查询有效“分块—节点”映射</text>
    <text x="135" y="67" text-anchor="middle" class="p">按目标节点读取有效内容分块</text>
    <text x="135" y="95" text-anchor="middle" class="small">多个目标节点的映射结果取并集</text>
    <text x="135" y="120" text-anchor="middle" class="small">只缩小候选范围，不直接生成证据</text>
  </g>
  <path class="line" d="M650 322H675"/>
  <polygon points="755,247 835,322 755,397 675,322" fill="#fff" stroke="#8fd1a2" stroke-width="2"/>
  <text x="755" y="314" text-anchor="middle" class="h">是否存在</text>
  <text x="755" y="340" text-anchor="middle" class="h">有效映射？</text>
  <path class="line" d="M835 322H850"/>
  <text x="837" y="309" class="tag">有</text>
  <g transform="translate(850,240)">
    <rect class="box purple" width="315" height="165" rx="16" filter="url(#shadow)"/>
    <text x="157" y="35" text-anchor="middle" class="h">节点范围混合检索</text>
    <text x="157" y="65" text-anchor="middle" class="p">仅在映射到的内容分块内召回</text>
    <text x="157" y="92" text-anchor="middle" class="small">向量 + BM25 + RRF + 可选 CrossEncoder</text>
    <text x="157" y="118" text-anchor="middle" class="small">校验知识库、分块版本和内容指纹</text>
    <text x="157" y="144" text-anchor="middle" class="small">结果：可用 / 未命中 / 证据不足 / 检索异常</text>
  </g>
  <!-- 全库回退 -->
  <text x="568" y="685" class="tag" fill="#d98524">全库回退路径（最多执行一次）</text>
  <path class="fallback" d="M315 600Q330 600 330 615V767Q330 782 345 782H568"/>
  <text x="350" y="767" class="tag" fill="#d98524">无目标节点：直接检索全库</text>
  <path class="fallbackJoin" d="M755 397V430"/>
  <text x="650" y="420" class="tag" fill="#d98524">未找到映射</text>
  <path class="fallbackJoin" d="M900 405V430H755"/>
  <text x="855" y="422" class="tag" fill="#d98524">未命中或证据不足</text>
  <circle cx="755" cy="430" r="5" fill="#d98524"/>
  <path class="fallback" d="M755 430V700"/>
  <g transform="translate(568,700)">
    <rect class="box orange" width="395" height="165" rx="16" filter="url(#shadow)"/>
    <text x="197" y="36" text-anchor="middle" class="h">全库混合检索</text>
    <text x="197" y="67" text-anchor="middle" class="p">取消节点范围限制</text>
    <text x="197" y="94" text-anchor="middle" class="small">复用同一查询条件与排序策略</text>
    <text x="197" y="120" text-anchor="middle" class="small">向量 + BM25 + RRF + 可选 CrossEncoder</text>
    <text x="197" y="146" text-anchor="middle" class="small">重新校验知识库、版本和内容指纹</text>
  </g>

  <!-- 汇总检索结果 -->
  <path class="line" d="M1007 405V455"/>
  <text x="1019" y="438" class="tag">证据可用</text>
  <path class="error" d="M1100 405V455"/>
  <text x="1112" y="438" class="tag" fill="#c65f58">检索异常</text>
  <path class="line" d="M963 782H1000V620"/>
  <g transform="translate(835,455)">
    <rect class="box blue" width="330" height="165" rx="16" filter="url(#shadow)"/>
    <text x="165" y="35" text-anchor="middle" class="h">汇总最终证据结果</text>
    <text x="165" y="65" text-anchor="middle" class="p">证据列表 + 节点证据映射</text>
    <text x="165" y="92" text-anchor="middle" class="small">记录查询与配置指纹、候选数量</text>
    <text x="165" y="118" text-anchor="middle" class="small">记录最终检索来源：</text>
    <text x="165" y="144" text-anchor="middle" class="small">节点范围 / 全库回退 / 直接全库 / 证据不足</text>
  </g>

  <!-- 工作流证据门禁 -->
  <path class="line" d="M1165 537H1230"/>
  <polygon points="1345,432 1460,537 1345,642 1230,537" fill="#fff" stroke="#8fd1a2" stroke-width="2"/>
  <text x="1345" y="479" text-anchor="middle" class="h">最终证据门禁</text>
  <text x="1345" y="509" text-anchor="middle" class="small">检索结果可用</text>
  <text x="1345" y="533" text-anchor="middle" class="small">数量和分数达到要求</text>
  <text x="1345" y="557" text-anchor="middle" class="small">来自同一知识库</text>
  <text x="1345" y="581" text-anchor="middle" class="small">证据、分块、排序位次均唯一</text>

  <!-- 工作流去向 -->
  <g transform="translate(1520,220)">
    <rect class="box red" width="225" height="150" rx="16"/>
    <text x="112" y="34" text-anchor="middle" class="h">检索基础设施异常</text>
    <text x="112" y="65" text-anchor="middle" class="small">节点范围异常不触发全库回退</text>
    <text x="112" y="90" text-anchor="middle" class="small">生产模式立即停止</text>
    <text x="112" y="114" text-anchor="middle" class="small">即使允许降级，也不能绕过</text>
    <text x="112" y="136" text-anchor="middle" class="small">证据门禁进入生成环节</text>
  </g>
  <path class="error" d="M1345 432V295H1520"/>
  <text x="1360" y="328" class="tag" fill="#c65f58">检索异常</text>

  <g transform="translate(1520,455)">
    <rect class="box green" width="225" height="165" rx="16" filter="url(#shadow)"/>
    <text x="112" y="34" text-anchor="middle" class="h">门禁通过</text>
    <text x="112" y="65" text-anchor="middle" class="p">冻结一份证据快照</text>
    <text x="112" y="92" text-anchor="middle" class="small">进入规划与生成环节</text>
    <text x="112" y="117" text-anchor="middle" class="small">继续执行普通资源审核</text>
    <text x="112" y="141" text-anchor="middle" class="small">按配置决定是否审核事实声明</text>
  </g>
  <path class="line" d="M1460 537H1520"/>
  <text x="1470" y="522" class="tag">通过</text>

  <g transform="translate(1520,715)">
    <rect class="box orange" width="225" height="140" rx="16"/>
    <text x="112" y="34" text-anchor="middle" class="h">证据不足</text>
    <text x="112" y="65" text-anchor="middle" class="small">不进入规划或生成环节</text>
    <text x="112" y="91" text-anchor="middle" class="small">停止事实型内容生成</text>
    <text x="112" y="117" text-anchor="middle" class="small">资源保持未发布</text>
  </g>
  <path class="fallback" d="M1345 642V785H1520"/>
  <text x="1362" y="675" class="tag" fill="#d98524">未通过</text>

  <rect x="70" y="920" width="1660" height="52" rx="12" fill="#edf5fb" stroke="#b8d7eb"/>
  <text x="900" y="952" text-anchor="middle" class="p">逻辑边界：节点映射只缩小候选范围；全库回退只处理映射缺失或证据不足；检索异常不回退，最终结果统一经过工作流证据门禁。</text>
</svg>
