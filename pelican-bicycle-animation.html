<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #dfeefb 0%, #f6fbff 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    gap: 18px;
    padding: 24px;
  }
  h1 { color: #2b3a4a; font-size: 22px; font-weight: 600; }
  p.hint { color: #6b7a88; font-size: 13px; }
  .stage {
    width: min(920px, 96vw);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(40, 70, 100, .18);
    background: #cfeafa;
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 动画定义 ---------- */

  /* 车轮旋转 */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spokes, .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin .9s linear infinite;
  }

  /* 腿部蹬踏：大腿绕髋关节摆动 */
  @keyframes thighNear {
    0%   { transform: rotate(28deg); }
    25%  { transform: rotate(2deg); }
    50%  { transform: rotate(-24deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(28deg); }
  }
  @keyframes thighFar {
    0%   { transform: rotate(-24deg); }
    25%  { transform: rotate(2deg); }
    50%  { transform: rotate(28deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(-24deg); }
  }
  /* 小腿绕膝盖弯折 */
  @keyframes shinNear {
    0%   { transform: rotate(-38deg); }
    25%  { transform: rotate(-72deg); }
    50%  { transform: rotate(-18deg); }
    75%  { transform: rotate(-64deg); }
    100% { transform: rotate(-38deg); }
  }
  @keyframes shinFar {
    0%   { transform: rotate(-18deg); }
    25%  { transform: rotate(-72deg); }
    50%  { transform: rotate(-38deg); }
    75%  { transform: rotate(-64deg); }
    100% { transform: rotate(-18deg); }
  }
  .thigh-near { animation: thighNear .9s linear infinite; transform-box: fill-box; transform-origin: top center; }
  .thigh-far  { animation: thighFar  .9s linear infinite; transform-box: fill-box; transform-origin: top center; }
  .shin-near  { animation: shinNear  .9s linear infinite; transform-box: fill-box; transform-origin: top center; }
  .shin-far   { animation: shinFar   .9s linear infinite; transform-box: fill-box; transform-origin: top center; }

  /* 身体起伏 + 头部点头 */
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2.5deg); } }
  .body-group  { animation: bob .45s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .head-group  { animation: nod .9s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom left; }

  /* 翅膀轻摆 */
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
  .wing { animation: flap .9s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }

  /* 云朵飘动 */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1050px); } }
  .clouds-1 { animation: drift 38s linear infinite; }
  .clouds-2 { animation: drift 55s linear infinite; }

  /* 太阳光芒旋转 */
  .sun-rays {
    transform-box: fill-box; transform-origin: center;
    animation: spin 24s linear infinite;
  }

  /* 路面虚线向后滚动 */
  @keyframes roadScroll { to { stroke-dashoffset: 160; } }
  .road-dash { animation: roadScroll .55s linear infinite; }

  /* 背景树木滚动 */
  @keyframes sceneryScroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .scenery { animation: sceneryScroll 6s linear infinite; }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑自行车 · 纯 SVG 2D 动画</h1>
<p class="hint">车轮旋转 · 双腿蹬踏 · 翅膀摆动 · 云朵与路景滚动（无 JavaScript，纯 CSS 驱动）</p>

<div class="stage">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的2D动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8dcf7"/>
      <stop offset="100%" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="100%" stop-color="#ffd54d"/>
    </radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d838c"/>
      <stop offset="100%" stop-color="#5f656e"/>
    </linearGradient>

    <!-- 云朵符号 -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="20" fill="#ffffff" opacity=".92"/>
      <ellipse cx="-28" cy="8" rx="30" ry="14" fill="#ffffff" opacity=".92"/>
      <ellipse cx="30" cy="8" rx="34" ry="15" fill="#ffffff" opacity=".92"/>
      <ellipse cx="6" cy="-12" rx="26" ry="14" fill="#ffffff" opacity=".95"/>
    </g>

    <!-- 背景树符号 -->
    <g id="tree">
      <rect x="-5" y="-8" width="10" height="26" fill="#8a5a33"/>
      <circle cx="0" cy="-30" r="24" fill="#5cab5e"/>
      <circle cx="-16" cy="-18" r="16" fill="#4f9d55"/>
      <circle cx="16" cy="-18" r="16" fill="#67b869"/>
    </g>

    <!-- 车轮：轮胎 + 辐条（辐条整体旋转） -->
    <g id="wheel">
      <circle r="68" fill="none" stroke="#2d3238" stroke-width="11"/>
      <circle r="57" fill="none" stroke="#b9c2cb" stroke-width="4"/>
      <g class="spokes" stroke="#cfd7de" stroke-width="3">
        <line x1="-56" y1="0" x2="56" y2="0"/>
        <line x1="0" y1="-56" x2="0" y2="56"/>
        <line x1="-40" y1="-40" x2="40" y2="40"/>
        <line x1="-40" y1="40" x2="40" y2="-40"/>
        <line x1="-52" y1="-22" x2="52" y2="22"/>
        <line x1="-52" y1="22" x2="52" y2="-22"/>
      </g>
      <circle r="9" fill="#39404a"/>
      <circle r="4" fill="#9aa6b1"/>
    </g>
  </defs>

  <!-- ============ 背景层 ============ -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(790,88)">
    <g class="sun-rays" stroke="#ffd54d" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-70"/><line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/><line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="-41" y1="-41" x2="-50" y2="-50"/><line x1="41" y1="-41" x2="50" y2="-50"/>
      <line x1="-41" y1="41" x2="-50" y2="50"/><line x1="41" y1="41" x2="50" y2="50"/>
    </g>
    <circle r="44" fill="url(#sunGlow)"/>
  </g>

  <!-- 云层：两组首尾相接循环 -->
  <g class="clouds-1">
    <use href="#cloud" x="150" y="110"/>
    <use href="#cloud" x="620" y="70"/>
    <use href="#cloud" x="1050" y="120"/>
    <use href="#cloud" x="1500" y="80"/>
  </g>
  <g class="clouds-2" opacity=".8">
    <use href="#cloud" x="380" y="160" transform="scale(1,1)"/>
    <use href="#cloud" x="880" y="180"/>
    <use href="#cloud" x="1300" y="150"/>
  </g>

  <!-- 远山 -->
  <path d="M0,430 L120,330 L230,410 L340,320 L470,425 L580,340 L700,420 L820,345 L900,415 L900,520 L0,520 Z"
        fill="#bcdcb8" opacity=".8"/>

  <!-- 地面 -->
  <rect x="0" y="440" width="900" height="80" fill="#8fcf6f"/>
  <rect x="0" y="446" width="900" height="10" fill="#7dbd5f" opacity=".6"/>

  <!-- 公路 -->
  <rect x="0" y="458" width="900" height="46" fill="url(#roadG)"/>
  <line class="road-dash" x1="-100" y1="481" x2="1000" y2="481"
        stroke="#f4f6f8" stroke-width="5" stroke-dasharray="46 34"/>

  <!-- 滚动的路边树木与灌木 -->
  <g clip-path="none">
    <g class="scenery">
      <g transform="translate(70,446) scale(.9)"><use href="#tree"/></g>
      <g transform="translate(250,446) scale(.7)"><use href="#tree"/></g>
      <g transform="translate(430,446) scale(1)"><use href="#tree"/></g>
      <g transform="translate(610,446) scale(.75)"><use href="#tree"/></g>
      <g transform="translate(790,446) scale(.95)"><use href="#tree"/></g>
      <g transform="translate(970,446) scale(.7)"><use href="#tree"/></g>
      <ellipse cx="160" cy="448" rx="26" ry="10" fill="#5cab5e"/>
      <ellipse cx="520" cy="448" rx="22" ry="9" fill="#67b869"/>
      <ellipse cx="880" cy="448" rx="26" ry="10" fill="#5cab5e"/>
    </g>
  </g>

  <!-- ============ 主体：自行车 + 鹈鹕 ============ -->

  <!-- 远侧腿部（颜色更深，画在车架后面） -->
  <g transform="translate(412,272)" opacity=".85">
    <g class="thigh-far">
      <rect x="-8" y="-4" width="16" height="58" rx="8" fill="#d8a35a"/>
      <g class="shin-far" transform="translate(0,50)">
        <rect x="-7" y="-4" width="14" height="56" rx="7" fill="#c98f45"/>
        <path d="M-4,50 L-22,62 L14,62 L6,50 Z" fill="#e0862f"/>
      </g>
    </g>
  </g>

  <!-- 自行车 -->
  <g>
    <use href="#wheel" x="300" y="385"/>
    <use href="#wheel" x="600" y="385"/>

    <!-- 车架 -->
    <g stroke="#e2622b" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="300" y1="385" x2="450" y2="385"/>
      <line x1="450" y1="385" x2="408" y2="282"/>
      <line x1="450" y1="385" x2="560" y2="300"/>
      <line x1="408" y1="282" x2="560" y2="300"/>
      <line x1="300" y1="385" x2="408" y2="282"/>
      <line x1="560" y1="300" x2="600" y2="385"/>
    </g>
    <g stroke="#c94f1d" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="560" y1="300" x2="552" y2="268"/>
      <path d="M552,268 Q556,258 574,260 L578,262" stroke-width="7"/>
    </g>

    <!-- 车座 -->
    <path d="M384,272 Q408,262 432,272 Q410,280 384,272 Z" fill="#3a4048"/>

    <!-- 链条 -->
    <line x1="300" y1="377" x2="450" y2="370" stroke="#39404a" stroke-width="4"/>
    <line x1="300" y1="393" x2="450" y2="400" stroke="#39404a" stroke-width="4"/>

    <!-- 曲柄与脚踏（整体旋转） -->
    <g class="crank" transform="translate(450,385)">
      <circle r="15" fill="none" stroke="#8a939e" stroke-width="5"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#39404a" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#39404a" stroke-width="7" stroke-linecap="round"/>
      <rect x="20" y="-4" width="22" height="9" rx="3" fill="#20242a"/>
      <rect x="-42" y="-5" width="22" height="9" rx="3" fill="#20242a"/>
    </g>
  </g>

  <!-- 鹈鹕身体 -->
  <g class="body-group">
    <!-- 尾羽 -->
    <path d="M338,214 Q300,196 296,222 Q322,232 342,240 Z" fill="#f4f7f9" stroke="#c8d2da" stroke-width="2"/>
    <!-- 身体 -->
    <ellipse cx="400" cy="228" rx="72" ry="48" fill="url(#body)" stroke="#c8d2da" stroke-width="2.5"/>
    <!-- 脖子 -->
    <path d="M436,196 Q462,178 470,158 L492,166 Q480,196 452,214 Z"
          fill="#ffffff" stroke="#c8d2da" stroke-width="2.5"/>
    <!-- 头部 -->
    <g class="head-group">
      <circle cx="478" cy="152" r="27" fill="#ffffff" stroke="#c8d2da" stroke-width="2.5"/>
      <!-- 鹈鹕大嘴 + 喉囊 -->
      <path d="M492,144 L572,168 Q576,172 570,176 L500,172 Z" fill="#f5a623" stroke="#d98a12" stroke-width="2"/>
      <path d="M494,168 Q520,204 556,182 Q566,176 570,176 L500,172 Z"
            fill="#ffc46b" stroke="#d98a12" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="482" cy="142" r="5.5" fill="#2b3238"/>
      <circle cx="484" cy="140" r="1.8" fill="#ffffff"/>
      <!-- 头顶小羽冠 -->
      <path d="M470,127 Q476,118 484,124 Q478,126 474,130 Z" fill="#f4f7f9" stroke="#c8d2da" stroke-width="1.5"/>
    </g>
    <!-- 翅膀 -->
    <g class="wing">
      <path d="M376,208 Q330,220 342,252 Q368,266 420,250 Q432,238 416,220 Q398,206 376,208 Z"
            fill="#e9eff3" stroke="#b9c5cf" stroke-width="2.5"/>
      <path d="M362,236 Q384,246 410,244" fill="none" stroke="#b9c5cf" stroke-width="2"/>
      <path d="M358,246 Q384,254 408,252" fill="none" stroke="#b9c5cf" stroke-width="2"/>
    </g>
  </g>

  <!-- 近侧腿部（画在最上层） -->
  <g transform="translate(408,268)">
    <g class="thigh-near">
      <rect x="-9" y="-4" width="18" height="60" rx="9" fill="#f2b96a"/>
      <g class="shin-near" transform="translate(0,52)">
        <rect x="-8" y="-4" width="16" height="58" rx="8" fill="#e5a54f"/>
        <path d="M-4,52 L-26,66 L18,66 L8,52 Z" fill="#f5a623" stroke="#d98a12" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- 围巾点缀，增加动感 -->
  <g>
    <path d="M452,196 Q470,186 490,180" fill="none" stroke="#e35d5d" stroke-width="10" stroke-linecap="round"/>
    <path d="M452,196 Q438,204 424,214 Q436,196 444,182 Z" fill="#e35d5d">
      <animateTransform attributeName="transform" type="rotate"
        values="0 452 196; -14 452 196; 0 452 196; 10 452 196; 0 452 196"
        dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
</div>

<p class="hint">↑ 刷新页面即可重新播放 · 可直接用浏览器打开本文件</p>
</body>
</html>
