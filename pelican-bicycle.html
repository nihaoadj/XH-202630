<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  :root {
    --sky-top: #aee3ff;
    --sky-bottom: #eaf7ff;
    --sun: #ffd54f;
    --ground: #8bc34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }
  .scene {
    position: relative;
    width: min(96vmin, 960px);
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
    background: linear-gradient(#aee3ff 0%, #c9ecff 55%, #d9f3ff 75%, #eaf7ff 100%);
  }
  svg { width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    font-size: clamp(12px, 2vmin, 18px);
    color: #3a6b35;
    background: rgba(255,255,255,.6);
    padding: 6px 16px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    letter-spacing: 1px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="scene">
  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#aee3ff"/>
        <stop offset="1" stop-color="#eaf7ff"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff3b0"/>
        <stop offset="0.6" stop-color="#ffe082"/>
        <stop offset="1" stop-color="#ffd54f" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9ccc65"/>
        <stop offset="1" stop-color="#7cb342"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#f2f6fb"/>
      </linearGradient>
      <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7fafc"/>
        <stop offset="1" stop-color="#dfe9f2"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="960" height="540" fill="url(#sky)"/>

    <!-- 太阳 + 光晕 -->
    <circle cx="830" cy="90" r="90" fill="url(#sunGlow)"/>
    <circle cx="830" cy="90" r="42" fill="#ffd54f"/>

    <!-- 云朵 -->
    <g fill="#ffffff" opacity="0.9">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="26s" repeatCount="indefinite"/>
        <ellipse cx="180" cy="90" rx="60" ry="22"/>
        <ellipse cx="230" cy="80" rx="45" ry="18"/>
        <ellipse cx="140" cy="82" rx="40" ry="16"/>
      </g>
      <g opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="32s" repeatCount="indefinite"/>
        <ellipse cx="620" cy="70" rx="70" ry="24"/>
        <ellipse cx="675" cy="60" rx="50" ry="19"/>
        <ellipse cx="570" cy="62" rx="45" ry="17"/>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0 360 Q 120 260 260 340 T 520 330 T 760 320 T 960 350 L 960 540 L 0 540 Z" fill="#b5d8a2" opacity="0.55"/>
    <path d="M0 390 Q 180 320 360 380 T 700 370 T 960 390 L 960 540 L 0 540 Z" fill="#a3cc8f" opacity="0.6"/>

    <!-- 地面 -->
    <rect x="0" y="420" width="960" height="120" fill="url(#ground)"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#689f38" stroke-width="4"/>

    <!-- 整辆车 + 鹈鹕，整体向左平移（骑车前进） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="980 0; -80 0" dur="16s" repeatCount="indefinite"/>

      <!-- 自行车 -->
      <g>
        <!-- 后轮 -->
        <g transform="translate(500 400)">
          <circle r="58" fill="none" stroke="#37474f" stroke-width="7"/>
          <circle r="8" fill="#37474f"/>
          <!-- 辐条 -->
          <g stroke="#90a4ae" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
            <line x1="0" y1="-54" x2="0" y2="54"/>
            <line x1="-54" y1="0" x2="54" y2="0"/>
            <line x1="-38" y1="-38" x2="38" y2="38"/>
            <line x1="38" y1="-38" x2="-38" y2="38"/>
          </g>
        </g>
        <!-- 前轮 -->
        <g transform="translate(720 400)">
          <circle r="58" fill="none" stroke="#37474f" stroke-width="7"/>
          <circle r="8" fill="#37474f"/>
          <g stroke="#90a4ae" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
            <line x1="0" y1="-54" x2="0" y2="54"/>
            <line x1="-54" y1="0" x2="54" y2="0"/>
            <line x1="-38" y1="-38" x2="38" y2="38"/>
            <line x1="38" y1="-38" x2="-38" y2="38"/>
          </g>
        </g>

        <!-- 车架 -->
        <g stroke="#263238" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="500" y1="400" x2="610" y2="300"/>
          <line x1="500" y1="400" x2="620" y2="370"/>
          <line x1="610" y1="300" x2="620" y2="370"/>
          <line x1="620" y1="370" x2="720" y2="400"/>
          <line x1="610" y1="300" x2="650" y2="330"/>
          <line x1="650" y1="330" x2="720" y2="360"/>
          <line x1="720" y1="360" x2="720" y2="400"/>
        </g>

        <!-- 车把 -->
        <line x1="650" y1="330" x2="640" y2="300" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
        <line x1="620" y1="298" x2="660" y2="300" stroke="#263238" stroke-width="8" stroke-linecap="round"/>

        <!-- 座垫 -->
        <ellipse cx="605" cy="292" rx="26" ry="10" fill="#263238"/>

        <!-- 中轴 + 脚踏 -->
        <circle cx="620" cy="370" r="10" fill="#37474f"/>
        <g stroke="#37474f" stroke-width="5" stroke-linecap="round">
          <line x1="620" y1="370" x2="645" y2="385"/>
          <line x1="620" y1="370" x2="595" y2="355"/>
        </g>
        <g transform="translate(620 370)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
            <rect x="38" y="-4" width="20" height="9" rx="2" fill="#263238"/>
            <rect x="-58" y="-4" width="20" height="9" rx="2" fill="#263238"/>
          </g>
        </g>
        <!-- 链条 -->
        <path d="M595 355 L 720 400" stroke="#546e7a" stroke-width="4" fill="none" opacity="0.6"/>
      </g>

      <!-- 鹈鹕 -->
      <g>
        <!-- 身体 -->
        <ellipse cx="585" cy="230" rx="85" ry="95" fill="url(#body)" stroke="#d6e2ec" stroke-width="2"/>

        <!-- 尾巴 -->
        <path d="M665 250 Q 720 235 740 260 Q 715 255 705 270 Q 695 250 665 270 Z" fill="#eef3f8" stroke="#d6e2ec" stroke-width="2"/>

        <!-- 翅膀（扇动） -->
        <g>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-8 660 230; 18 660 230; -8 660 230" dur="1.8s" repeatCount="indefinite"/>
            <path d="M655 200 Q 760 150 790 210 Q 750 200 720 235 Q 690 220 655 200 Z" fill="url(#wingGrad)" stroke="#c3d2de" stroke-width="2"/>
          </g>
        </g>

        <!-- 腿（踩踏，左右交替） -->
        <g>
          <line x1="560" y1="310" x2="620" y2="370" stroke="#f59e0b" stroke-width="9" stroke-linecap="round">
            <animate attributeName="x2" values="620;595;620" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y2" values="370;355;370" dur="0.9s" repeatCount="indefinite"/>
          </line>
          <line x1="590" y1="310" x2="645" y2="385" stroke="#f59e0b" stroke-width="9" stroke-linecap="round">
            <animate attributeName="x2" values="645;620;645" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y2" values="385;370;385" dur="0.9s" repeatCount="indefinite"/>
          </line>
        </g>
        <!-- 脚 -->
        <g fill="#f59e0b">
          <ellipse cx="620" cy="372" rx="16" ry="8">
            <animate attributeName="cx" values="620;595;620" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="372;357;372" dur="0.9s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="645" cy="387" rx="16" ry="8">
            <animate attributeName="cx" values="645;620;645" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="387;372;387" dur="0.9s" repeatCount="indefinite"/>
          </ellipse>
        </g>

        <!-- 脖子 -->
        <path d="M530 200 Q 495 160 490 120 Q 488 95 505 88" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
        <path d="M530 200 Q 495 160 490 120 Q 488 95 505 88" fill="none" stroke="#d6e2ec" stroke-width="36" stroke-linecap="round" opacity="0.35"/>

        <!-- 头 -->
        <circle cx="508" cy="78" r="34" fill="#ffffff" stroke="#d6e2ec" stroke-width="2"/>

        <!-- 眼睛 -->
        <circle cx="520" cy="68" r="7" fill="#1a1a1a"/>
        <circle cx="522" cy="66" r="2.5" fill="#ffffff"/>
        <!-- 眨眼 -->
        <g>
          <rect x="512" y="62" width="18" height="3" rx="1.5" fill="#ffffff">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.55;0.6;1" dur="4s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- 喙 + 喉囊 -->
        <path d="M540 72 L 620 84 L 540 96 Z" fill="#ffb300" stroke="#e09900" stroke-width="1.5"/>
        <path d="M540 96 Q 570 130 600 92 Z" fill="#ff9e00"/>
        <!-- 喙尖钩 -->
        <path d="M618 84 L 626 87 L 620 90 Z" fill="#e09900"/>

        <!-- 头羽 -->
        <path d="M492 50 Q 478 40 490 30" fill="none" stroke="#dfe9f2" stroke-width="3" stroke-linecap="round"/>

        <!-- 手臂（扶车把） -->
        <path d="M640 210 Q 655 260 640 300" fill="none" stroke="url(#body)" stroke-width="14" stroke-linecap="round"/>
        <path d="M640 210 Q 655 260 640 300" fill="none" stroke="#d6e2ec" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
        <circle cx="640" cy="300" r="9" fill="#ffb300"/>
      </g>
    </g>
  </svg>
  <div class="caption">🚲 鹈鹕骑车，出发！</div>
</div>
</body>
</html>
